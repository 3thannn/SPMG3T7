name: CI

# One workflow, a job per half, no `paths:` filters.
#
# The halves are not independent — the client calls the API, so a change to one
# can break the other — and a check that only sometimes runs cannot safely be
# marked as required: a pull request that does not touch the filtered path would
# wait forever for a check that never starts. Running both every time costs a
# couple of runner-minutes and removes that trap.
#
# The jobs run in parallel, so a full run takes as long as the slower half
# rather than the sum of the two.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Build (byte-compile all sources)
        run: python -m compileall -q app

      - name: Test
        run: pytest

      - name: Test blackout migration and trigger
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest integration/test_unavailability_db.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
