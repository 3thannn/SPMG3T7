name: CI

# One workflow, a job per half, no `paths:` filters.
#
# The halves are not independent — the client calls the API, so a change to one
# can break the other — and a check that only sometimes runs cannot safely be
# marked as required: a pull request that does not touch the filtered path would
# wait forever for a check that never starts. Running both every time costs a
# couple of runner-minutes and removes that trap.
#
# The jobs run in parallel, so a full run takes as long as the slower half
# rather than the sum of the two.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Build (byte-compile all sources)
        run: python -m compileall -q app

      - name: Test, failing under the coverage floor in pyproject.toml
        run: pytest --cov

      - name: Test database migrations and review RPCs
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: >-
          pytest integration/test_unavailability_db.py integration/test_change_review_db.py
          integration/test_us12_4_db.py integration/test_us8_4_db.py
          integration/test_safety_check_changes_db.py integration/test_organiser_registration_db.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test, failing under the coverage thresholds in vite.config.ts
        run: npm test -- --coverage

  e2e:
    # The browser journeys in frontend/e2e-isolated, against backend/e2e_server.py
    # (the real API over in-memory stores). No secrets and no shared database.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Backend virtualenv (Playwright starts the API from backend/.venv)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser journeys
        working-directory: frontend
        run: npm run test:e2e
