[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# `pytest --cov` measures app/ by line and by branch. The suite is the tests
# traced to acceptance criteria (docs/testing/test_cases.txt), not a test per
# line, so the floor is what that suite reaches. Grouped Technical cases also
# cover the Supabase adapters using recording clients. The remaining untested
# branches are described in the workbook Summary, not counted as E2E coverage.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85.6
