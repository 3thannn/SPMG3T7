[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# `pytest --cov` measures app/ by line and by branch. The suite is the tests
# traced to acceptance criteria (docs/testing/test_cases.txt), not a test per
# line, so the floor is what that suite reaches. What it leaves out (mainly the
# Supabase store adapters and database-down branches, which the DB integration
# tests and E2E journeys exercise instead) is explained in the workbook's
# Summary. Raise this when tests are added.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 77
