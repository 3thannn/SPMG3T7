- story: US10.4
  jira: SPMG3T7-90
  title: Notify registered Attendees when their event's date, time or venue changes
  core_feature: Notification System
  acceptance_criteria:
  - id: US10.4-AC1
    text: When an accepted change (US11.2 / US11.3) changes the date or time of an event with registrations,
      every Attendee with an active registration is notified with the new date and time.
    kind: behaviour
  - id: US10.4-AC2
    text: When a replacement venue (US14.5 / US12.4) on a registered event is confirmed by Venue Staff,
      registered Attendees are notified of the new venue.
    kind: behaviour
  - id: US10.4-AC3
    text: The notice only shows Attendee-safe details (event name, new date/time/venue). No internal planning
      notes or reasons (US20.1 rule).
    kind: behaviour
  - id: US10.4-AC4
    text: Withdrawn registrations are not notified.
    kind: behaviour
  - id: US10.4-AC5
    text: Uses US10.1's list and read/unread toggle. In-app only.
    kind: note
    note: 'Constraint: in-app notices only.'
