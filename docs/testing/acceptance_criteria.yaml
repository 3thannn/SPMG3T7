    text: When the Coordinator confirms an event (US4.7), the Organiser is notified.
    kind: behaviour
  - id: US10.3-AC3
    text: When an event goes back to planning (US11.3, US12.4), the Organiser is notified.
    kind: behaviour
  - id: US10.3-AC4
    text: Uses US10.1's list and read/unread toggle. In-app only.
    kind: note
    note: 'Constraint: in-app notices only.'
